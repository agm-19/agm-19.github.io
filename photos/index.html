<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remnants of Light</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Caveat:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBFAF7;
    --ink:#2A2723;
    --soft:#9C968C;
    --hairline:#ECE8E0;
    --sage:#7A8B7F;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--paper);color:var(--ink);font-family:'EB Garamond',serif;font-size:18px;line-height:1.6}
  ::selection{background:#E4E9E4}

  /* Nav — links only, same shape as the rest of the site, tinted to this page */
  nav{
    display:flex;justify-content:center;flex-wrap:wrap;
    gap:6px 26px;padding:18px 24px;
    border-bottom:1px solid var(--hairline);
  }
  nav a{
    font-family:'EB Garamond',serif;font-size:13px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--soft);text-decoration:none;transition:color .2s;
  }
  nav a:hover{color:var(--ink)}
  nav a.here{color:var(--ink)}

  .page{max-width:980px;margin:0 auto;padding:0 24px 120px}

  /* Header */
  .logo{display:block;width:min(240px,60%);margin:0 auto 26px;opacity:.92}
  header{text-align:center;padding:72px 0 56px}
  .title{font-size:34px;font-weight:500;letter-spacing:.02em}
  .subtitle{font-family:'Caveat',cursive;font-size:22px;color:var(--soft);margin-top:10px}
  .rule{width:36px;height:1px;background:var(--ink);opacity:.35;margin:34px auto 0}

  /* Album — contact sheet */
  .album{padding-top:8px;columns:2;column-gap:40px}
  .entry{break-inside:avoid;margin-bottom:36px;opacity:0;transform:translateY(12px);transition:opacity .7s ease,transform .7s ease}
  .entry.seen{opacity:1;transform:none}
  .entry img{display:block;width:100%;height:auto;border-radius:2px;box-shadow:0 6px 20px rgba(42,39,35,.10);cursor:zoom-in;background:#f0eee9;transition:box-shadow .25s ease,transform .25s ease}
  .entry:hover img{box-shadow:0 12px 30px rgba(42,39,35,.17);transform:translateY(-3px)}
  .entry .under{text-align:center;padding-top:9px}
  .caption{font-family:'Caveat',cursive;font-size:19px;line-height:1.25;color:var(--ink)}
  .place{font-family:'EB Garamond',serif;font-style:italic;font-size:12.5px;color:var(--soft);margin-top:2px}
  .date{margin-top:4px}

  /* Empty state */
  .empty{text-align:center;padding:60px 0 20px}
  .empty p{font-style:italic;color:var(--soft)}
  .empty .c{font-family:'Caveat',cursive;font-size:26px;color:var(--sage);margin-top:8px}

  /* Lightbox */
  .lightbox{position:fixed;inset:0;background:rgba(251,250,247,.97);display:none;align-items:center;justify-content:center;flex-direction:column;padding:36px;z-index:50}
  .lightbox.open{display:flex}
  .lightbox img{max-width:92vw;max-height:82vh;border-radius:2px;box-shadow:0 18px 60px rgba(42,39,35,.18)}
  .lightbox .lbcap{font-family:'Caveat',cursive;font-size:26px;color:var(--ink);margin-top:18px;text-align:center}
  .lightbox .lbdate{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin-top:6px}
  .lightbox .close{position:absolute;top:22px;right:28px;background:none;border:none;font-family:'EB Garamond',serif;font-style:italic;font-size:17px;color:var(--soft);cursor:pointer;padding:8px}
  .lightbox .close:hover{color:var(--ink)}
  .lightbox .nav-arrow{position:absolute;top:50%;transform:translateY(-50%);background:none;border:none;font-family:'EB Garamond',serif;font-size:34px;color:var(--soft);cursor:pointer;padding:14px 18px;line-height:1;transition:color .2s}
  .lightbox .nav-arrow:hover{color:var(--ink)}
  .lightbox #lbPrev{left:8px} .lightbox #lbNext{right:8px}
  @media (max-width:600px){ .lightbox .nav-arrow{font-size:26px;padding:10px 12px} }

  .more{text-align:center;padding-top:34px}
  .more a{font-family:'EB Garamond',serif;font-style:italic;font-size:16px;color:var(--sage);text-decoration:none;border-bottom:1px solid transparent;padding-bottom:2px;transition:border-color .2s}
  .more a:hover{border-bottom-color:var(--sage)}
  footer{text-align:center;padding-top:16px}
  footer p{font-size:13px;font-style:italic;color:var(--soft);opacity:.7}

  @media (max-width:760px){ .album{columns:1;column-gap:0} .entry{margin-bottom:52px} }
  @media (max-width:560px){ .caption{font-size:15px} }

  @media (prefers-reduced-motion: reduce){
    .entry{opacity:1;transform:none;transition:none}
    *{transition:none!important}
  }
</style>
</head>

const lbImg   = document.getElementById('lbImg');
const lbCap   = document.getElementById('lbCap');
const lbDate  = document.getElementById('lbDate');
const lbClose = document.getElementById('lbClose');

function fmtDate(iso){
  const parts = String(iso).split('-').map(Number);
  if(parts.length !== 3 || parts.some(isNaN)) return '';
  const d = new Date(parts[0], parts[1] - 1, parts[2]);   // local, no timezone drift
  return d.toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' });
}

const observer = ('IntersectionObserver' in window)
  ? new IntersectionObserver(entries=>{
      entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('seen'); observer.unobserve(en.target); } });
    },{threshold:.12})
  : null;

function renderEntry(item, i){
  const entry = document.createElement('div');
  entry.className = 'entry';

  const img = document.createElement('img');
  img.src = 'img/' + item.file;
  img.loading = 'lazy';
  img.decoding = 'async';
  img.alt = item.caption || 'Photograph';
  img.addEventListener('click', ()=> openLightbox(i));

  const under = document.createElement('div');
  under.className = 'under';

  if(item.caption){
    const cap = document.createElement('p');
    cap.className = 'caption';
    cap.textContent = item.caption;
    under.appendChild(cap);
  }

  if(item.place){
    const pl = document.createElement('p');
    pl.className = 'place';
    pl.textContent = item.place;
    under.appendChild(pl);
  }

  const date = document.createElement('p');
  date.className = 'date';
  date.textContent = fmtDate(item.date);
  under.appendChild(date);

  entry.appendChild(img);
  entry.appendChild(under);
  album.appendChild(entry);

  if(observer) observer.observe(entry); else entry.classList.add('seen');
}

let current = 0;

function openLightbox(i){
  current = (i + PHOTOS.length) % PHOTOS.length;
  const item = PHOTOS[current];
  lbImg.src = 'img/' + item.file;
  lbImg.alt = item.caption || 'Photograph';
  lbCap.textContent = item.caption || '';
  lbDate.textContent = [item.place, fmtDate(item.date)].filter(Boolean).join('  ·  ');
  lightbox.classList.add('open');
}
function step(n){ openLightbox(current + n); }
function closeLightbox(){ lightbox.classList.remove('open'); lbImg.src = ''; }

document.getElementById('lbPrev').addEventListener('click', e=>{ e.stopPropagation(); step(-1); });
document.getElementById('lbNext').addEventListener('click', e=>{ e.stopPropagation(); step(1); });
lbClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', e=>{ if(e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', e=>{
  if(!lightbox.classList.contains('open')) return;
  if(e.key === 'Escape') closeLightbox();
  if(e.key === 'ArrowLeft') step(-1);
  if(e.key === 'ArrowRight') step(1);
});

/* start */
emptyEl.hidden = PHOTOS.length !== 0;
PHOTOS.forEach(renderEntry);   // index passed automatically as 2nd arg
footNote.textContent = 'all shot on a mass-produced sensor, edited with questionable taste';
</script>
</body>
</html>
